
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amal Krishna</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #FFFBEF;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Image Sections */
  section {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #FFFBEF;
  }

  section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Waitlist Section */
  .waitlist {
    background: #FFFBEF;
    padding: 30px 20px;
    text-align: center;
    color: #80011F;
  }

  .waitlist p {
    font-size: 15px;
    color: #80011F;
    margin: 0 0 35px 0;
    line-height: 1.5;
  }

  .waitlist-btn {
    display: inline-block;
    background: #80011F;
    color: #FFFBEF;
    text-decoration: none;
    padding: 16px 45px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 17px;
    transition: transform 0.3s ease,
                background 0.3s ease;
  }

  .waitlist-btn:hover {
    background: #600017;
    transform: scale(1.04);
  }

  /* Social & Contact Section */
  .social {
    padding: 20px 20px 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #FFFBEF;
  }

  .social a {
    color: #80011F;
    background: transparent;
    text-decoration: none;
    font-size: 15px;
    margin: 8px;
    padding: 22px 25px;
    border: 1px solid #D8C9C5;
    border-radius: 50px;
    width: 400px;
    max-width: 100%;
    text-align: center;
    transition: background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
  }

  .social a:hover {
    background: #80011F;
    color: #FFFBEF;
    border-color: #80011F;
  }

  /* Mobile Adjustments */
  @media (max-width: 480px) {
    .waitlist {
      padding: 30px 20px;
    }

    .waitlist p {
      font-size: 14px;
      margin-bottom: 35px;
    }

    .waitlist-btn {
      padding: 16px 40px;
      font-size: 15px;
    }

    .social {
      padding: 20px 20px 80px;
    }

    .social a {
      width: 100%;
      max-width: 400px;
      padding: 22px 25px;
      font-size: 15px;
    }
  }
</style>
</head>

<body>

  <!-- Image Sections -->
  <section>
    <img src="./nw1.jpg" alt="Portfolio image 1">
  </section>

  <section>
    <img src="./nw2.jpg" alt="Portfolio image 2">
  </section>

  <section>
    <img src="./nw3.jpg" alt="Portfolio image 3">
  </section>

  <section>
    <img src="./nw4.jpg" alt="Portfolio image 4">
  </section>

  <!-- Waitlist Section -->
  <div class="waitlist">

    <p>
      Be the first to master the move. Join the exclusive waitlist
      to get notified when we launch.
    </p>

    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSe_FDPvk3pTsbbuYQTrEyxS3yAzZv7WYn77OrVmMF66GB2aDg/viewform"
      class="waitlist-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      JOIN THE WAITLIST
    </a>

  </div>

  <!-- Social & Contact Links -->
  <div class="social">

    <a
      href="https://www.instagram.com/amlkrishnacu"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>

    <a
      href="https://youtube.com/@amlkrishnacu"
      target="_blank"
      rel="noopener noreferrer"
    >
      YouTube
    </a>

    <a
      href="https://wa.me/message/WXOHDIKU4JZXJ1"
      target="_blank"
      rel="noopener noreferrer"
    >
      WhatsApp
    </a>

    <a href="mailto:amlkrishnacu@gmail.com">
      Mail
    </a>

  </div>

</body>
</html>
