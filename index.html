<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFBEF">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Amal Krishna — Creativity, marketing, design and personal branding.">

  <title>Amal Krishna</title>

  <style>
    :root {
      --cream: #FFFBEF;
      --burgundy: #80011F;
      --burgundy-dark: #600017;
      --border: #D8C9C5;
      --muted: #806B6C;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--burgundy);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* Scroll progress indicator */

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 1000;
      pointer-events: none;
    }

    .scroll-progress-bar {
      width: 100%;
      height: 100%;
      background: var(--burgundy);
      transform: scaleX(0);
      transform-origin: left;
      will-change: transform;
    }

    /* Image sections */

    .image-section {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--cream);
      position: relative;
    }

    .image-section img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s var(--ease);
    }

    @media (hover: hover) and (pointer: fine) {
      .image-section:hover img {
        transform: scale(1.015);
      }
    }

    /* Scroll reveal */

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 850ms var(--ease),
        transform 850ms var(--ease);
      transition-delay: var(--delay, 0ms);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Scrolling typography */

    .marquee {
      width: 100%;
      overflow: hidden;
      padding: 22px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--cream);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee-scroll 32s linear infinite;
      will-change: transform;
    }

    .marquee-group {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 26px;
      padding-right: 26px;
      white-space: nowrap;
    }

    .marquee span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.19em;
      color: var(--burgundy);
    }

    .marquee .separator {
      font-size: 15px;
      opacity: 0.55;
    }

    @keyframes marquee-scroll {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Waitlist */

    .waitlist {
      padding: 48px 20px 38px;
      text-align: center;
      background: var(--cream);
    }

    .waitlist p {
      max-width: 440px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      text-wrap: pretty;
    }

    /* Primary button */

    .waitlist-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 54px;
      padding: 16px 38px;
      border: 1px solid var(--burgundy);
      border-radius: 50px;
      background: var(--burgundy);
      color: var(--cream);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.045em;
      transition:
        background 250ms ease,
        color 250ms ease,
        box-shadow 250ms ease,
        transform 250ms var(--ease);
    }

    .waitlist-btn:active {
      transform: scale(0.97);
    }

    @media (hover: hover) and (pointer: fine) {
      .waitlist-btn:hover {
        background: transparent;
        color: var(--burgundy);
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(128, 1, 31, 0.10);
      }
    }

    /* Social links */

    .social {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px 20px 78px;
      background: var(--cream);
    }

    .social a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 400px;
      max-width: 100%;
      min-height: 58px;
      padding: 17px 25px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 50px;
      color: var(--burgundy);
      background: transparent;
      text-decoration: none;
      font-size: 15px;
      transition:
        color 300ms ease,
        border-color 300ms ease,
        background 300ms ease,
        transform 300ms var(--ease);
    }

    .social a span {
      position: relative;
      z-index: 1;
      transition: transform 300ms var(--ease);
    }

    @media (hover: hover) and (pointer: fine) {
      .social a:hover {
        color: var(--cream);
        background: var(--burgundy);
        border-color: var(--burgundy);
        transform: translateY(-2px);
      }

      .social a:hover span {
        transform: translateX(3px);
      }
    }

    .social a:active {
      transform: scale(0.985);
    }

    /* Keyboard accessibility */

    a:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 5px;
    }

    /* Mobile */

    @media (max-width: 600px) {
      .image-section {
        aspect-ratio: 16 / 9;
      }

      .waitlist {
        padding: 35px 22px 30px;
      }

      .waitlist p {
        font-size: 14px;
        line-height: 1.75;
        margin-bottom: 25px;
      }

      .waitlist-btn {
        min-height: 50px;
        padding: 15px 30px;
        font-size: 13px;
      }

      .marquee {
        padding: 18px 0;
      }

      .marquee-group {
        gap: 20px;
        padding-right: 20px;
      }

      .marquee span {
        font-size: 10px;
      }

      .social {
        gap: 10px;
        padding: 12px 22px 55px;
      }

      .social a {
        width: 100%;
        min-height: 54px;
        padding: 16px 20px;
        font-size: 14px;
      }
    }

    /* Reduced motion accessibility */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }

      .marquee-track {
        animation: none;
      }

      .scroll-progress {
        display: none;
      }
    }
  </style>
</head>

<body>

          <span>MARKETING</span>
          <span class="separator">•</span>
          <span>DESIGN</span>

  <script>
    (() => {
      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const revealElements = document.querySelectorAll('.reveal');
      const progressBar = document.getElementById('progressBar');

      // Reveal elements as they enter the viewport.
      if (reduceMotion || !('IntersectionObserver' in window)) {
        revealElements.forEach(element => {
          element.classList.add('is-visible');
        });
      } else {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              obs.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.08,
          rootMargin: '0px 0px -35px 0px'
        });

        revealElements.forEach((element, index) => {
          element.style.setProperty(
            '--delay',
            `${Math.min(index % 4, 3) * 70}ms`
          );
          observer.observe(element);
        });
      }

      // Update the top progress bar efficiently while scrolling.
      if (reduceMotion) return;

      let ticking = false;

      function updateProgress() {
        const scrollableHeight =
          document.documentElement.scrollHeight - window.innerHeight;

        const progress = scrollableHeight > 0
          ? window.scrollY / scrollableHeight
          : 0;

        progressBar.style.transform =
          `scaleX(${Math.min(1, Math.max(0, progress))})`;

        ticking = false;
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(updateProgress);
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener('resize', updateProgress, { passive: true });

      updateProgress();
    })();
  </script>
